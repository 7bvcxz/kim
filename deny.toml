# cargo-deny configuration — see SECURITY.md "Dependency and supply-chain policy".

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Every ignored advisory needs an issue link and an expiry rationale.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
# Permissive licenses compatible with "MIT OR Apache-2.0" binaries. Anything else
# (e.g. MPL-2.0, LGPL, GPL) needs an explicit, reviewed exception below.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
]
# Reviewed exceptions (crate-scoped, never global):
# - webpki-root-certs: Mozilla CA root data under the permissive CDLA-Permissive-2.0 data
#   license; required by ureq's native-tls connector (kim catalog refresh, Step 05).
exceptions = [
    { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
]

[licenses.private]
# Workspace crates are `publish = false`; they are licensed MIT OR Apache-2.0 in-tree.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
