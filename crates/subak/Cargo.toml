[package]
name = "subak"
version = "0.0.1"
description = "Subak: persistent Windows-first terminal with a separate Host and Clients"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "subak"
path = "src/main.rs"

[lints]
workspace = true

[dev-dependencies]
# tests/cli.rs validates `subak --json` output with xtask/src/jsonschema.rs (test-only).
regex = "1.13.1"
serde_json = "1.0.154"
