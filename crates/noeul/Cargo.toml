[package]
name = "noeul"
version = "0.0.1"
description = "Noeul: small native screenshot and floating-pin tool (pre-alpha foundation, Step 49)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "noeul"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# CLI parsing with contract-shaped errors (docs/CLI_CONTRACT.md), as in `kim`.
clap = { version = "4.6.7", features = ["derive"] }
# Shortcuts: manifest, user layer, conflicts and the `RegisterHotKey` backend (ADR 0017).
kim-hotkeys = { version = "0.0.1", path = "../kim-hotkeys" }
serde = { version = "1.0.229", features = ["derive"] }
# The --json envelope and IPC v1 messages.
serde_json = "1.0.154"
# config.toml (NOEUL-FR-102); already in the workspace lock.
# Only the features the lock already has (no `std`: its weak features would add crates to the lock).
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }

[target."cfg(windows)".dependencies]
# Plain Win32 (ADR 0023): GDI screen capture into memory, layered pin windows, the optional
# notification-area icon, the clipboard (read on paste only), the per-user named pipe with peer
# identity checks, input-desktop and session checks. No GUI framework, no hook, no service.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# tests compile xtask/src/jsonschema.rs (the schema-check validator), which needs `regex`;
# already in the workspace lock, test-only, never shipped.
regex = "1.13.1"
