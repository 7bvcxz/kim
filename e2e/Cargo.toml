[package]
name = "kim-e2e"
version = "0.0.0"
description = "End-to-end suite for Kim tools. Runs only via `cargo xtask e2e` (AGENTS.md §4)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dev-dependencies]
kim = { path = "../crates/kim" }
serde_json = "1.0.154"
sha2 = "0.11.1"
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
